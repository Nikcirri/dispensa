# Controlla il codice a ogni modifica: controllo dei tipi, test, build web e build Android di prova (non pubblica niente).
name: Controllo

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Casa condivisa: due "telefoni" (browser) collegati all'emulatore di Firebase, con le regole di firestore.rules.
  casa:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Prepara il browser di prova
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Casa condivisa con l'emulatore di Firebase
        run: npx -y firebase-tools@15 emulators:exec --only auth,firestore --project demo-dispensa "python3 tests/house.py"
      - name: Screenshot della prova
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-casa
          path: tests/screenshots/house-*.png
          if-no-files-found: ignore

  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build Android di prova (come quella pubblicata, ma non firmata e non pubblicata)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain assembleRelease 2>&1 | tee gradle.log; then
            MSG=$( { sed -n '/What went wrong/,/Try:/p' gradle.log; grep -E "^Caused by|^e: |error:|Missing class" gradle.log | head -n 15; } | head -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build Android fallita::$MSG"
            exit 1
          fi

      - name: Controlla permessi e dimensione dell'APK
        run: bash scripts/check-apk.sh "$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
